<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT-кроссворд</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0d1117;
    --panel: #151b23;
    --panel-hi: #1c2430;
    --line: #29323f;
    --text: #e8ecf2;
    --muted: #8b96a8;
    --accent: #204af2;
    --accent-dim: #5a3fc0;
    --coral: #ff6b5b;
    --wrong: #ef6a6a;
    --wrong-dim: #4a2a2a;
    --gold: var(--coral);
  }

  *{
    box-sizing: border-box;
  }

  html,
  body{
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body{
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
    position: relative;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: 0.18;
    pointer-events: none;
  }

  .wrap{
    width: 100%;
    max-width: 640px;
    min-width: 0;
    position: relative;
    z-index: 1;
  }

  header{
    width: 100%;
    max-width: 100%;
    margin-bottom: 34px;
  }

  .eyebrow{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin: 0 0 10px;
    overflow-wrap: anywhere;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }

  .lead{
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 52ch;
    overflow-wrap: anywhere;
  }

  .progress{
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin: 26px 0 8px;
  }

  .progress-track{
    flex: 1 1 auto;
    min-width: 0;
    height: 6px;
    border-radius: 3px;
    background: var(--panel-hi);
    overflow: hidden;
  }

  .progress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--coral));
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  .progress-count{
    flex: 0 0 auto;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .clue{
    width: 100%;
    max-width: 100%;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 22px 20px;
    margin-bottom: 16px;
    transition: border-color .3s ease, background .3s ease;
  }

  .clue.solved{
    border-color: var(--accent-dim);
    background: linear-gradient(
      180deg,
      rgba(32,74,242,0.09),
      rgba(255,107,91,0.03)
    );
  }

  .clue-num{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .clue-text{
    width: 100%;
    max-width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 16px;
    overflow-wrap: anywhere;
    word-break: normal;
  }

  .boxes{
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .box{
    width: 30px;
    height: 38px;
    flex: 0 0 30px;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--text);
    background: var(--panel-hi);
    text-transform: uppercase;
    transition:
      background .35s ease,
      border-color .35s ease,
      transform .35s ease;
  }

  .box.filled{
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    transform: translateY(-2px);
  }

  .clue.shake .boxes{
    animation: shake .4s ease;
  }

  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); }
    40%{ transform: translateX(6px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }

  .answer-row{
    display: flex;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    gap: 10px;
  }

  input.answer{
    flex: 1 1 0;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14.5px;
    line-height: 1.4;
    outline: none;
    transition: border-color .2s ease;
  }

  input.answer:focus{
    border-color: var(--accent);
  }

  input.answer:disabled{
    color: var(--accent);
    border-color: var(--accent-dim);
    opacity: .8;
  }

  input.answer.wrong{
    border-color: var(--wrong);
  }

  button.check{
    flex: 0 0 auto;
    max-width: 100%;
    min-height: 42px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.2;
    cursor: pointer;
    transition: filter .15s ease, transform .1s ease;
  }

  button.check:hover{
    filter: brightness(1.08);
  }

  button.check:active{
    transform: scale(0.97);
  }

  button.check:disabled{
    background: var(--panel-hi);
    color: var(--muted);
    cursor: default;
  }

  .hint-row{
    width: 100%;
    max-width: 100%;
    margin-top: 8px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--muted);
    min-height: 16px;
    overflow-wrap: anywhere;
  }

  .hint-row.wrong{
    color: var(--wrong);
  }

  .hint-row.right{
    color: var(--accent);
  }

  /* Toast */
  .toast{
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translate(-50%, -140%);
    width: max-content;
    max-width: calc(100vw - 24px);
    background: var(--panel-hi);
    border: 1.5px solid var(--accent);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 999px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    transition: transform .45s cubic-bezier(.34,1.56,.64,1);
    z-index: 50;
    white-space: nowrap;
  }

  .toast.show{
    transform: translate(-50%, 0%);
  }

  .toast .hand{
    font-size: 18px;
    flex: 0 0 auto;
  }

  /* Overlay */
  .overlay{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(5,7,10,0.86);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
    z-index: 100;
    padding: 20px;
  }

  .overlay.show{
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-card{
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    border-radius: 14px;
    padding: 40px 34px;
    max-width: 460px;
    width: 100%;
    min-width: 0;
    text-align: center;
    transform: scale(.92) translateY(10px);
    transition: transform .5s cubic-bezier(.34,1.56,.64,1);
  }

  .overlay.show .overlay-card{
    transform: scale(1) translateY(0);
  }

  .overlay-eyebrow{
    font-family: 'Space Grotesk', sans-serif;
    color: var(--accent);
    font-size: 13px;
    margin-bottom: 14px;
  }

  .overlay-card h2{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    margin: 0 0 18px;
    overflow-wrap: anywhere;
  }

  .secret{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.04em;
    color: var(--gold);
    margin: 0 0 20px;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .overlay-card p.desc{
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 24px;
  }

  .overlay-card button{
    max-width: 100%;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }

  .overlay-card button:hover{
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Планшеты и телефоны */
  @media (max-width: 520px){

    html,
    body{
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }

    body{
      padding: 24px 12px 50px;
    }

    .wrap{
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    header{
      margin-bottom: 24px;
    }

    .eyebrow{
      font-size: 12px;
    }

    h1{
      font-size: 29px;
      line-height: 1.15;
    }

    .lead{
      width: 100%;
      max-width: 100%;
      font-size: 14px;
      line-height: 1.55;
    }

    .progress{
      gap: 8px;
      margin: 20px 0 8px;
    }

    .progress-count{
      font-size: 12px;
    }

    .clue{
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 18px 16px 17px;
      margin-bottom: 14px;
    }

    .clue-text{
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .boxes{
      gap: 5px;
      margin-bottom: 14px;
    }

    .box{
      width: 29px;
      height: 36px;
      flex-basis: 29px;
      font-size: 15px;
    }

    /*
      На телефоне поле и кнопка идут друг под другом.
      Поэтому они физически не могут вытолкнуть карточку
      за пределы экрана.
    */
    .answer-row{
      width: 100%;
      max-width: 100%;
      min-width: 0;
      flex-direction: column;
      gap: 9px;
    }

    input.answer{
      width: 100%;
      max-width: 100%;
      min-width: 0;
      flex: none;
      min-height: 44px;
      padding: 10px 13px;
      font-size: 14px;
    }

    button.check{
      width: 100%;
      max-width: 100%;
      min-height: 44px;
      padding: 10px 16px;
      flex: none;
    }

    .hint-row{
      font-size: 12px;
    }

    /*
      Уведомление тоже не должно вылезать за границы
      маленького экрана.
    */
    .toast{
      width: calc(100vw - 24px);
      max-width: calc(100vw - 24px);
      padding: 10px 14px;
      border-radius: 14px;
      white-space: normal;
      text-align: center;
      line-height: 1.35;
    }

    .overlay{
      padding: 14px;
    }

    .overlay-card{
      width: 100%;
      max-width: 100%;
      padding: 30px 20px;
    }

    .overlay-card h2{
      font-size: 23px;
    }

    .secret{
      font-size: 27px;
    }
  }

  /* Очень маленькие телефоны */
  @media (max-width: 360px){

    body{
      padding-left: 9px;
      padding-right: 9px;
    }

    h1{
      font-size: 27px;
    }

    .clue{
      padding-left: 14px;
      padding-right: 14px;
    }

    .clue-text{
      font-size: 14.5px;
    }

    .boxes{
      gap: 4px;
    }

    .box{
      width: 27px;
      height: 35px;
      flex-basis: 27px;
      font-size: 14px;
    }

    .toast{
      width: calc(100vw - 18px);
      max-width: calc(100vw - 18px);
      font-size: 13px;
      padding: 9px 12px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>

<body>

<div class="toast" id="toast">
  <span class="hand">✋</span>
  <span id="toastText">Верно! Подними руку</span>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-eyebrow">Все 5 из 5 разгаданы</div>
    <h2>Кроссворд решён</h2>
    <div class="secret">Молодец!</div>
    <button id="closeOverlay">Закрыть</button>
  </div>
</div>

<div class="wrap">

  <header>
    <p class="eyebrow">IT-словарь · 5 вопросов</p>

    <h1>Разгадай термины</h1>

    <p class="lead">
      Прочитай определение и впиши слово в поле ниже.
      Правильный ответ подсвечивается зелёным — подними руку,
      чтобы это заметили.
    </p>
  </header>

  <div class="progress">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="progress-count" id="progressCount">
      0 / 5
    </div>
  </div>

  <div id="clues"></div>

</div>

<script>

const QUESTIONS = [
  {
    text: "Устройство, которое преобразует данные из памяти компьютера в видеосигнал для монитора",
    answer: "видеокарта"
  },
  {
    text: "Набор правил и инструментов для разработки приложений, упрощающий работу программиста",
    answer: "фреймворк"
  },
  {
    text: "Технология беспроводной передачи данных на короткие расстояния",
    answer: "блютуз"
  },
  {
    text: "Распределённая база данных, лежащая в основе криптовалют и многих современных сервисов",
    answer: "блокчейн"
  },
  {
    text: "Сервис, который даёт доступ к вычислительным мощностям и хранилищам данных через интернет",
    answer: "облако"
  }
];


const cluesEl = document.getElementById('clues');
const progressFill = document.getElementById('progressFill');
const progressCount = document.getElementById('progressCount');
const toast = document.getElementById('toast');
const toastText = document.getElementById('toastText');
const overlay = document.getElementById('overlay');

let solvedCount = 0;
let toastTimer = null;


function normalize(s){
  return s
    .trim()
    .toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/\s+/g, ' ');
}


function showToast(msg){
  toastText.textContent = msg;

  toast.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2200);
}


function buildClue(q, index){

  const card = document.createElement('div');
  card.className = 'clue';


  const num = document.createElement('div');
  num.className = 'clue-num';
  num.textContent =
    'Вопрос ' + (index + 1) + ' из ' + QUESTIONS.length;

  card.appendChild(num);


  const text = document.createElement('div');
  text.className = 'clue-text';
  text.textContent = q.text;

  card.appendChild(text);


  const boxes = document.createElement('div');
  boxes.className = 'boxes';

  const boxEls = [];


  for(let i = 0; i < q.answer.length; i++){

    const b = document.createElement('div');

    b.className = 'box';

    boxes.appendChild(b);

    boxEls.push(b);
  }


  card.appendChild(boxes);


  const row = document.createElement('div');
  row.className = 'answer-row';


  const input = document.createElement('input');

  input.className = 'answer';
  input.type = 'text';
  input.placeholder = 'Впиши ответ...';
  input.autocomplete = 'off';

  row.appendChild(input);


  const btn = document.createElement('button');

  btn.className = 'check';
  btn.textContent = 'Проверить';

  row.appendChild(btn);


  card.appendChild(row);


  const hint = document.createElement('div');

  hint.className = 'hint-row';

  card.appendChild(hint);


  let solved = false;


  function submit(){

    if(solved) return;

    const val = normalize(input.value);

    if(val.length === 0) return;


    if(val === normalize(q.answer)){

      solved = true;

      card.classList.add('solved');


      const letters = q.answer.toUpperCase().split('');


      boxEls.forEach((b, i) => {

        setTimeout(() => {

          b.textContent = letters[i];

          b.classList.add('filled');

        }, i * 45);

      });


      input.value = q.answer;

      input.disabled = true;

      btn.disabled = true;


      hint.textContent = 'Верно!';

      hint.className = 'hint-row right';


      showToast('Верно! Подними руку ✋');


      solvedCount++;

      updateProgress();

    } else {

      input.value = '';

      input.classList.add('wrong');

      card.classList.remove('shake');

      void card.offsetWidth;

      card.classList.add('shake');


      hint.textContent = 'Неверно, попробуй ещё раз';

      hint.className = 'hint-row wrong';


      setTimeout(() => {
        input.classList.remove('wrong');
      }, 400);
    }
  }


  btn.addEventListener('click', submit);


  input.addEventListener('keydown', (e) => {

    if(e.key === 'Enter'){
      submit();
    }

  });


  input.addEventListener('input', () => {

    if(hint.classList.contains('wrong')){

      hint.textContent = '';

      hint.className = 'hint-row';
    }

  });


  return card;
}


QUESTIONS.forEach((q, i) => {

  cluesEl.appendChild(
    buildClue(q, i)
  );

});


function updateProgress(){

  const pct =
    (solvedCount / QUESTIONS.length) * 100;

  progressFill.style.width = pct + '%';

  progressCount.textContent =
    solvedCount + ' / ' + QUESTIONS.length;


  if(solvedCount === QUESTIONS.length){

    setTimeout(() => {

      overlay.classList.add('show');

    }, 500);
  }
}


document
  .getElementById('closeOverlay')
  .addEventListener('click', () => {

    overlay.classList.remove('show');

  });

</script>

</body>
</html>
